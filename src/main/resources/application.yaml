server:
  port: 9090

spring:
  application:
    name: minibugtracker
  
  datasource:
    url: jdbc:postgresql://localhost:5432/bugtracker_db
    username: postgres
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/minibugtracker}

logging:
  level:
    root: INFO
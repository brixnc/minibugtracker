@if (comments().length === 0) {
  <app-empty-state
    icon="forum"
    title="Noch keine Kommentare"
    hint="Halten Sie Zwischenstände fest, damit das Team den Verlauf nachvollziehen kann."
  />
} @else {
  <ul class="comments">
    @for (comment of comments(); track comment.id) {
      <li class="comment">
        <span class="comment__avatar" aria-hidden="true">{{ initials(comment.author) }}</span>

        <div class="comment__body">
          <div class="comment__head">
            <span class="comment__author">{{ comment.author }}</span>
            @if (comment.createdAt) {
              <span class="comment__date app-muted">
                {{ comment.createdAt | date: 'dd.MM.yyyy HH:mm' }}
              </span>
            }
            <span class="app-spacer"></span>

            <!-- Rollenabhängige Aktion: nur ADMIN. -->
            <button
              *appIsInRoles="[roles.Admin]"
              mat-icon-button
              type="button"
              matTooltip="Kommentar löschen"
              aria-label="Kommentar löschen"
              (click)="remove(comment)"
            >
              <mat-icon>delete_outline</mat-icon>
            </button>
          </div>
          <p class="comment__text">{{ comment.content }}</p>
        </div>
      </li>
    }
  </ul>
}

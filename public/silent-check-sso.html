<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Silent SSO Check</title>
  </head>
  <body>
    <!--
      Diese Seite wird von Keycloak in einem unsichtbaren iframe geladen.
      Sie reicht die Antwort des Authorization-Servers an die Anwendung
      zurueck, damit ein bereits angemeldeter Benutzer nicht erneut die
      Login-Maske sieht.
    -->
    <script>
      parent.postMessage(location.href, location.origin);
    </script>
  </body>
</html>
